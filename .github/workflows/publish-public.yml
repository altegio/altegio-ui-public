name: Publish approved public package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed 0.x public beta version
        required: true
        type: string
      confirmation:
        description: 'Exact phrase: publish @altegio/ui VERSION'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  verify:
    # Require the configured publication gates and protected main.
    if: vars.ALTEGIO_UI_PUBLIC_PUBLISH_ENABLED == 'true' && github.repository == 'altegio/altegio-ui-public' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    container: node:24.20.0@sha256:be23f54a88d34e8824c741b19b91064094f92c1c97b194144bfc8b50d67258e2
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      NODE_OPTIONS: --max-old-space-size=3072
      # Match the home directory to the container user for Firefox consumers.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout in the container user home
        # Checkout configures Git under /github/home; browser checks require /root.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check reviewed release identity
        run: |
          node scripts/public-release.mjs "$RELEASE_VERSION" "$RELEASE_CONFIRMATION"
      - name: Require an unused public version
        run: |
          node --input-type=module -e 'const r=await fetch(`https://registry.npmjs.org/@altegio%2fui/${encodeURIComponent(process.env.RELEASE_VERSION)}`,{signal:AbortSignal.timeout(15000)});if(r.status!==404)throw new Error(r.ok?"Version already exists on npm":`Registry check failed: ${r.status}`)'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm public:build
      - run: pnpm typecheck
      - run: pnpm test-token-compat
      - run: pnpm test-package-compat
      - run: pnpm test-dist-compat
      - run: pnpm test-public-package
      - run: pnpm audit-dependencies
      - run: pnpm test-public-export
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test-unit
      - run: pnpm test-public-consumers
      - uses: actions/upload-artifact@v4
        with:
          name: approved-public-tarball
          path: |
            artifacts/public/*.tgz
            artifacts/public/package-info.json
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-public
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          name: approved-public-tarball
          path: candidate
      - name: Verify approved tarball integrity and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLIC_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import assert from "node:assert/strict";import fs from "node:fs";import{createHash}from"node:crypto";const p=JSON.parse(fs.readFileSync("candidate/package-info.json"));assert.equal(p.name,"@altegio/ui");assert.equal(p.version,process.env.RELEASE_VERSION);assert.match(p.version,/^0\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/);assert.equal(p.filename,`altegio-ui-${p.version}.tgz`);assert.equal(createHash("sha256").update(fs.readFileSync(`candidate/${p.filename}`)).digest("hex"),p.sha256)'
          npm publish ./candidate/*.tgz --access public --provenance --tag beta
      - name: Verify registry artifact and promote the beta to the default install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLIC_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const info = JSON.parse(fs.readFileSync('candidate/package-info.json'))
          const response = await fetch(`https://registry.npmjs.org/@altegio%2fui/${info.version}`, { signal: AbortSignal.timeout(15000) })
          assert.ok(response.ok, `Registry returned ${response.status}`)
          const published = await response.json()
          assert.equal(published.name, info.name)
          assert.equal(published.version, info.version)
          assert.equal(published.dist.integrity, info.integrity)
          assert.ok(published.dist.attestations?.provenance, 'npm provenance is required')
          NODE
          npm dist-tag add "@altegio/ui@$RELEASE_VERSION" latest
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          const tags = JSON.parse(execFileSync('npm', ['view', '@altegio/ui', 'dist-tags', '--json', '--registry=https://registry.npmjs.org/'], { encoding: 'utf8' }))
          assert.equal(tags.beta, process.env.RELEASE_VERSION)
          assert.equal(tags.latest, process.env.RELEASE_VERSION)
          NODE
